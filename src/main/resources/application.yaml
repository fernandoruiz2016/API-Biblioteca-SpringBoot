server:
  servlet:
    context-path: /api/
  port: 8070

spring:
  application:
    name: biblioteca
  datasource:
    url: jdbc:postgresql://localhost:5432/BD_BIBLIOTECA?currentSchema=bd_gestionBiblioteca
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      minimum-idle: 3
      max-lifetime: 10000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

jwt:
  secret: bxsdgergdvdfsnfioeniroto
  expiration: 864000

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui/.html

logging:
  level:
    pe:
      edu:
        idat: DEBUG
    org:
      springframework:
        security: INFO